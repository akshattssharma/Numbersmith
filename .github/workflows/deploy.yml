name: test and deploy

on:
  push:
    # Both names accepted on purpose. The repo's branch is `main`, but a local
    # `git init` on older Git creates `master`, and a workflow that silently
    # never fires is the worst failure mode here: Pages just stays blank with
    # no error anywhere obvious.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The divergence suite is the product thesis expressed as assertions.
      # If personalization stops happening, this is what says so.
      - run: npm test

  build:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages serves a project site from /<repo>/, so the asset base has
      # to match or every script tag 404s. Derived from the repo name rather
      # than hard-coded, so a fork or a rename still deploys correctly.
      - run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

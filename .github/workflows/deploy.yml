name: test and deploy

on:
  push:
    # Both names accepted on purpose. The repo's branch is `main`, but a local
    # `git init` on older Git creates `master`, and a workflow that silently
    # never fires is the worst failure mode here: Pages just stays blank with
    # no error anywhere obvious.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20. Vite 7 declares engines ^20.19.0 || >=22.12.0, so
      # "20" only works if setup-node happens to resolve to a late-enough 20.x —
      # a dependency on luck that fails confusingly when it breaks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # The divergence suite is the product thesis expressed as assertions.
      # If personalization stops happening, this is what says so.
      - run: npm test

      # GitHub Pages serves a project site from /<repo>/, so the asset base has
      # to match or every script tag 404s. Derived from the repo name rather
      # than hard-coded, so a fork or a rename still deploys correctly, and it
      # preserves capitalisation — Pages URLs are case-sensitive.
      - run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # `enablement: true` turns Pages on via the API if it is not already.
      # Without it, a push that lands before Pages has been switched on fails
      # with "Get Pages site failed" — which reads like a broken build when it
      # is really just a setting that has not been clicked yet.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
